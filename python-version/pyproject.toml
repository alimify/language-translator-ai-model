[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-ai"
version = "1.0.0"
description = "English-Bengali Neural Machine Translation with Transformer"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "requests",
    "sentencepiece",
]

[project.scripts]
translator = "src.main:main"
